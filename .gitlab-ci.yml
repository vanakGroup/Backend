stages:
  - lint
  # - test
  - build-image

variables:
  GOPROXY: "https://hub.megan.ir/go,direct"
  CGO_ENABLED: "0"
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_NAME: "$HAMRAVESH_REGISTRY/vanak-backend"

# ── Cache Go modules across jobs ─────────────────────────────────────────────
.go-cache: &go-cache
  cache:
    key: "go-modules-$CI_COMMIT_REF_SLUG"
    paths:
      - .go-cache/
  variables:
    GOPATH: "$CI_PROJECT_DIR/.go-cache"

# ── Lint ──────────────────────────────────────────────────────────────────────
lint:
  stage: lint
  image: golang:1.26-alpine
  <<: *go-cache
  script:
    - |
      UNFORMATTED=$(gofmt -l ./...)
      if [ -n "$UNFORMATTED" ]; then
        echo "The following files are not gofmt-compliant:"
        echo "$UNFORMATTED"
        exit 1
      fi
    - go vet ./...
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "ops/ci-cd"' # 👈 اضافه شد
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ── Test ──────────────────────────────────────────────────────────────────────
