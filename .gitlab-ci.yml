#     - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ── Build & Push Docker Image ─────────────────────────────────────────────────
build-image:
  stage: build-image
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  before_script:
    - cp "$APP_DOTENV" .env
    - docker login -u "$HAMRAVESH_USERNAME" -p "$HAMRAVESH_PASSWORD" "$HAMRAVESH_REGISTRY"
  script:
    - |
      docker build \
        -f docker/Dockerfile \
        -t "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" \
        -t "$IMAGE_NAME:latest" \
        .
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE_NAME:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "ops/ci-cd"'