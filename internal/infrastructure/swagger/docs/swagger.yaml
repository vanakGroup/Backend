definitions:
  base.MultipleMessageResponse:
    properties:
      data:
        type: object
      message:
        additionalProperties:
          type: string
        type: object
      statusCode:
        example: 422
        type: integer
    type: object
  base.SingleMessageResponse:
    properties:
      data:
        type: object
      message:
        example: Successfully
        type: string
      statusCode:
        example: 200
        type: integer
    type: object
info:
  contact: {}
paths:
  /auth/login:
    post:
      description: Authenticate user into the Vanak Parking System using phone number
        and returns user session info
      parameters:
      - description: User's mobile phone number
        in: body
        name: request
        required: true
        schema:
          properties:
            phone:
              type: string
          type: object
      responses:
        "200":
          description: Successfully logged in and session created
          schema:
            $ref: '#/definitions/base.SingleMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/base.MultipleMessageResponse'
      summary: User Login with Phone
      tags:
      - Authentication
  /auth/send-otp:
    post:
      description: Validates the Iranian phone number and sends a temporary verification
        SMS
      parameters:
      - description: User's mobile phone number
        in: body
        name: request
        required: true
        schema:
          properties:
            phone:
              type: string
          type: object
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/base.SingleMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/base.MultipleMessageResponse'
      summary: Send OTP Verification Code
      tags:
      - Authentication
  /auth/verify-otp:
    post:
      description: Verifies the temporary OTP code sent to the user's mobile phone
        number
      parameters:
      - description: Phone number and received OTP code
        in: body
        name: request
        required: true
        schema:
          properties:
            otp:
              type: string
            phone:
              type: string
          type: object
      responses:
        "200":
          description: Phone number verified successfully
          schema:
            $ref: '#/definitions/base.SingleMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/base.MultipleMessageResponse'
      summary: Verify OTP Code
      tags:
      - Authentication
  /profile:
    put:
      consumes:
      - application/json
      description: Updates the user's profile information. Phone number cannot be
        changed here. Requires Bearer Token.
      parameters:
      - description: Profile update payload
        in: body
        name: request
        required: true
        schema:
          properties:
            firstname:
              type: string
            lastname:
              type: string
            national_code:
              type: string
            shaba_number:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Profile updated successfully
          schema:
            $ref: '#/definitions/base.SingleMessageResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/base.MultipleMessageResponse'
        "401":
          description: Unauthorized - Missing or invalid token
          schema:
            $ref: '#/definitions/base.SingleMessageResponse'
      security:
      - BearerAuth: []
      summary: Update Customer Profile
      tags:
      - Profile
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
